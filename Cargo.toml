[workspace]
resolver = "2"
members = ["crates/rc-core", "crates/rc-agent", "crates/rc-platform-windows", "crates/rc-media"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
thiserror = "2.0"
bytes = "1.10"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "io-util", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }

[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal-0.25.1" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# Do not use panic=abort: unwinding lets isolated worker failures be reported.
