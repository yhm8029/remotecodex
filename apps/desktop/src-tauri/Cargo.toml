[package]
name = "remotecodex-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT"
[workspace]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
url = "2.5"
rc-platform-windows = { path = "../../../crates/rc-platform-windows" }
